ktor {
  deployment {
    port = 3060
    host = 0.0.0.0  # Listen on all interfaces for Android emulator access
    watch = [ classes, resources ]  # Enable auto-reload
  }
  application {
    modules = [ aishou.AppKt.module ]
  }
  development = true  # Enable development mode
}

aishou {
  jwt {
    issuer = "aishou"
    audience = "aishou-clients"
    secret = ${?JWT_SECRET}
    accessMinutes = 525600  # 1 year (365 * 24 * 60)
    refreshDays = 60
  }
  mongo {
    uri = ${?MONGO_URI}
    db = "aishou"
  }
  onesignal {
    appId = ${?ONESIGNAL_APP_ID}
    restKey = ${?ONESIGNAL_REST_KEY}
    publicBaseUrl = "https://aishou.site"
  }
  openai {
    apiKey = ${?OPENAI_API_KEY}
  }
}